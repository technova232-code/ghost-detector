<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كاشف الأشباح</title>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #00ff88;
    --red: #ff2244;
    --amber: #ffaa00;
    --dark: #050a08;
    --panel: rgba(0,255,136,0.04);
    --border: rgba(0,255,136,0.18);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--dark);
    color: var(--green);
    font-family: 'Tajawal', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Scan lines */
  body::before {
    content:'';
    position:fixed; inset:0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,255,136,0.015) 2px,
      rgba(0,255,136,0.015) 4px
    );
    pointer-events:none;
    z-index:999;
  }

  /* Noise overlay */
  body::after {
    content:'';
    position:fixed; inset:0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events:none;
    z-index:998;
    opacity: 0.4;
  }

  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px;
    position:relative;
    z-index:1;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 20px 0 10px;
  }

  .logo {
    font-family: 'Creepster', cursive;
    font-size: 3rem;
    color: var(--green);
    text-shadow: 0 0 20px var(--green), 0 0 60px rgba(0,255,136,0.3);
    letter-spacing: 4px;
    animation: flicker 4s infinite;
  }

  .subtitle {
    font-size: 0.85rem;
    color: rgba(0,255,136,0.5);
    letter-spacing: 6px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  @keyframes flicker {
    0%,95%,100% { opacity:1; }
    96% { opacity:0.4; }
    97% { opacity:1; }
    98% { opacity:0.2; }
    99% { opacity:1; }
  }

  /* Camera feed */
  .camera-wrapper {
    position: relative;
    margin: 20px 0;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    background: #000;
    aspect-ratio: 4/3;
  }

  #cameraFeed {
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    filter: grayscale(0.3) brightness(0.8) contrast(1.2);
  }

  .camera-placeholder {
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:12px;
    color: rgba(0,255,136,0.3);
    font-size: 0.85rem;
  }

  .camera-placeholder .icon { font-size: 3rem; opacity:0.4; }

  /* Radar overlay on camera */
  .radar-overlay {
    position:absolute;
    inset:0;
    pointer-events:none;
    display:none;
  }

  .radar-overlay.active { display:block; }

  .scan-line {
    position:absolute;
    top:0; left:50%;
    width:50%;
    height:2px;
    background: linear-gradient(to right, transparent, rgba(0,255,136,0.8));
    transform-origin: 0 1px;
    animation: radar-spin 3s linear infinite;
  }

  @keyframes radar-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .radar-circle {
    position:absolute;
    border-radius:50%;
    border: 1px solid rgba(0,255,136,0.15);
  }

  /* Ghost blip */
  .ghost-blip {
    position:absolute;
    width:12px;
    height:12px;
    border-radius:50%;
    background: var(--red);
    box-shadow: 0 0 10px var(--red), 0 0 30px rgba(255,34,68,0.5);
    display:none;
    animation: blip-pulse 0.5s ease-in-out infinite;
  }

  @keyframes blip-pulse {
    0%,100% { transform:scale(1); opacity:1; }
    50% { transform:scale(1.5); opacity:0.6; }
  }

  /* Status panel */
  .status-panel {
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 16px;
    background: var(--panel);
    margin-bottom: 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .status-item { text-align:center; }

  .status-label {
    font-size: 0.7rem;
    color: rgba(0,255,136,0.45);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .status-value {
    font-size: 1.6rem;
    font-weight: 900;
    color: var(--green);
    text-shadow: 0 0 10px var(--green);
    transition: color 0.3s;
  }

  .status-value.danger { color: var(--red); text-shadow: 0 0 10px var(--red); }
  .status-value.warn   { color: var(--amber); text-shadow: 0 0 10px var(--amber); }

  /* EMF Bar */
  .emf-section { margin-bottom: 16px; }

  .emf-label {
    font-size: 0.7rem;
    color: rgba(0,255,136,0.45);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 8px;
    display:flex;
    justify-content:space-between;
  }

  .emf-bar-track {
    height: 24px;
    background: rgba(0,0,0,0.5);
    border: 1px solid var(--border);
    border-radius: 2px;
    overflow:hidden;
    position:relative;
  }

  .emf-bar-fill {
    height:100%;
    width:0%;
    background: linear-gradient(to right, #00ff88, #ffaa00, #ff2244);
    transition: width 0.1s ease;
    position:relative;
  }

  .emf-bar-fill::after {
    content:'';
    position:absolute;
    top:0; right:0;
    width:4px; height:100%;
    background: white;
    box-shadow: 0 0 8px white;
    opacity:0.8;
  }

  .emf-segments {
    position:absolute;
    inset:0;
    display:flex;
  }

  .emf-seg {
    flex:1;
    border-right: 1px solid rgba(0,255,136,0.1);
  }

  /* Audio bars */
  .audio-section { margin-bottom: 16px; }

  .audio-bars {
    display:flex;
    gap:3px;
    height:48px;
    align-items:flex-end;
  }

  .audio-bar {
    flex:1;
    background: var(--green);
    border-radius: 1px 1px 0 0;
    min-height: 2px;
    transition: height 0.05s ease;
    box-shadow: 0 0 4px rgba(0,255,136,0.3);
  }

  /* Alert */
  .alert-box {
    border: 2px solid var(--red);
    border-radius: 4px;
    padding: 12px 16px;
    background: rgba(255,34,68,0.08);
    text-align:center;
    display:none;
    animation: alert-glow 0.8s ease-in-out infinite;
    margin-bottom: 16px;
  }

  .alert-box.show { display:block; }

  @keyframes alert-glow {
    0%,100% { box-shadow: 0 0 10px rgba(255,34,68,0.3); }
    50% { box-shadow: 0 0 30px rgba(255,34,68,0.7), 0 0 60px rgba(255,34,68,0.3); }
  }

  .alert-title {
    font-size: 1.2rem;
    font-weight: 900;
    color: var(--red);
    text-shadow: 0 0 10px var(--red);
    letter-spacing: 4px;
  }

  .alert-msg {
    font-size: 0.8rem;
    color: rgba(255,34,68,0.7);
    margin-top: 4px;
  }

  /* Log */
  .log-section {
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--panel);
    padding: 12px;
    margin-bottom: 16px;
    height: 100px;
    overflow-y:auto;
    font-size: 0.75rem;
    color: rgba(0,255,136,0.55);
    font-family: monospace;
  }

  .log-entry { margin-bottom: 3px; }
  .log-entry.danger { color: var(--red); }
  .log-entry.warn { color: var(--amber); }

  .log-section::-webkit-scrollbar { width:4px; }
  .log-section::-webkit-scrollbar-track { background:transparent; }
  .log-section::-webkit-scrollbar-thumb { background: rgba(0,255,136,0.3); }

  /* Button */
  .btn-start {
    width:100%;
    padding: 16px;
    background: transparent;
    border: 2px solid var(--green);
    color: var(--green);
    font-family: 'Tajawal', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 4px;
    cursor:pointer;
    border-radius: 4px;
    text-transform: uppercase;
    transition: all 0.2s;
    text-shadow: 0 0 10px var(--green);
    box-shadow: 0 0 20px rgba(0,255,136,0.1);
    margin-bottom: 20px;
  }

  .btn-start:hover {
    background: rgba(0,255,136,0.08);
    box-shadow: 0 0 30px rgba(0,255,136,0.3);
  }

  .btn-start.active {
    border-color: var(--red);
    color: var(--red);
    text-shadow: 0 0 10px var(--red);
    box-shadow: 0 0 20px rgba(255,34,68,0.2);
  }

  /* Body red flash */
  body.ghost-detected {
    animation: body-flash 0.4s ease;
  }

  @keyframes body-flash {
    0% { background: #050a08; }
    30% { background: #1a0008; }
    100% { background: #050a08; }
  }

  /* Glitch text */
  .glitch {
    animation: glitch 0.2s steps(2) infinite;
  }

  @keyframes glitch {
    0% { clip-path: inset(0 0 80% 0); transform: translate(-2px); }
    25% { clip-path: inset(40% 0 40% 0); transform: translate(2px); }
    50% { clip-path: inset(80% 0 0 0); transform: translate(-1px); }
    75% { clip-path: inset(20% 0 60% 0); transform: translate(1px); }
    100% { clip-path: inset(0 0 80% 0); transform: translate(0); }
  }

  .corner-tl, .corner-tr, .corner-bl, .corner-br {
    position:fixed;
    width:20px; height:20px;
    z-index:1000;
    opacity:0.4;
  }
  .corner-tl { top:10px; right:10px; border-top:1px solid var(--green); border-right:1px solid var(--green); }
  .corner-tr { top:10px; left:10px; border-top:1px solid var(--green); border-left:1px solid var(--green); }
  .corner-bl { bottom:10px; right:10px; border-bottom:1px solid var(--green); border-right:1px solid var(--green); }
  .corner-br { bottom:10px; left:10px; border-bottom:1px solid var(--green); border-left:1px solid var(--green); }
</style>
</head>
<body>

<div class="corner-tl"></div>
<div class="corner-tr"></div>
<div class="corner-bl"></div>
<div class="corner-br"></div>

<div class="container">

  <div class="header">
    <div class="logo">👻 G-DETECT</div>
    <div class="subtitle">نظام كشف الأشباح — الإصدار ٣.٣</div>
  </div>

  <!-- Camera -->
  <div class="camera-wrapper" id="cameraWrapper">
    <video id="cameraFeed" autoplay muted playsinline></video>
    <canvas id="cameraCanvas" style="display:none;"></canvas>
    <div class="camera-placeholder" id="cameraPlaceholder">
      <div class="icon">📷</div>
      <span>الكاميرا غير مفعّلة</span>
    </div>
    <div class="radar-overlay" id="radarOverlay">
      <svg style="position:absolute;inset:0;width:100%;height:100%;" viewBox="0 0 400 300">
        <circle cx="200" cy="150" r="60" fill="none" stroke="rgba(0,255,136,0.1)" stroke-width="1"/>
        <circle cx="200" cy="150" r="120" fill="none" stroke="rgba(0,255,136,0.08)" stroke-width="1"/>
        <circle cx="200" cy="150" r="180" fill="none" stroke="rgba(0,255,136,0.06)" stroke-width="1"/>
        <line x1="200" y1="0" x2="200" y2="300" stroke="rgba(0,255,136,0.06)" stroke-width="1"/>
        <line x1="0" y1="150" x2="400" y2="150" stroke="rgba(0,255,136,0.06)" stroke-width="1"/>
        <!-- sweep gradient -->
        <defs>
          <radialGradient id="sweep" cx="0" cy="50%" r="50%">
            <stop offset="0%" stop-color="rgba(0,255,136,0.5)"/>
            <stop offset="100%" stop-color="rgba(0,255,136,0)"/>
          </radialGradient>
        </defs>
        <path id="sweepPath" fill="url(#sweep)"/>
      </svg>
      <div class="ghost-blip" id="ghostBlip"></div>
    </div>
  </div>

  <!-- Alert -->
  <div class="alert-box" id="alertBox">
    <div class="alert-title">⚠ شبح مكتشف ⚠</div>
    <div class="alert-msg" id="alertMsg">نشاط كهرومغناطيسي غير طبيعي</div>
  </div>

  <!-- Status -->
  <div class="status-panel">
    <div class="status-item">
      <div class="status-label">مستوى النشاط</div>
      <div class="status-value" id="activityLevel">0%</div>
    </div>
    <div class="status-item">
      <div class="status-label">حالة المنطقة</div>
      <div class="status-value" id="zoneStatus">آمنة</div>
    </div>
    <div class="status-item">
      <div class="status-label">درجة الحرارة</div>
      <div class="status-value" id="tempVal">22°C</div>
    </div>
    <div class="status-item">
      <div class="status-label">تردد EMF</div>
      <div class="status-value" id="emfVal">0 Hz</div>
    </div>
  </div>

  <!-- EMF -->
  <div class="emf-section">
    <div class="emf-label">
      <span>📡 مستوى الموجات الكهرومغناطيسية</span>
      <span id="emfPct">0%</span>
    </div>
    <div class="emf-bar-track">
      <div class="emf-segments">
        <div class="emf-seg"></div><div class="emf-seg"></div><div class="emf-seg"></div>
        <div class="emf-seg"></div><div class="emf-seg"></div><div class="emf-seg"></div>
        <div class="emf-seg"></div><div class="emf-seg"></div><div class="emf-seg"></div>
        <div class="emf-seg"></div>
      </div>
      <div class="emf-bar-fill" id="emfFill"></div>
    </div>
  </div>

  <!-- Audio -->
  <div class="audio-section">
    <div class="emf-label">
      <span>🎙 تحليل الأصوات الخفية</span>
      <span id="audioPct">0 dB</span>
    </div>
    <div class="audio-bars" id="audioBars">
    </div>
  </div>

  <!-- Log -->
  <div class="log-section" id="logBox">
    <div class="log-entry">[ نظام ] جاهز للمسح...</div>
  </div>

  <!-- Button -->
  <button class="btn-start" id="startBtn" onclick="toggleScan()">
    ابدأ المسح 👻
  </button>

</div>

<script>
// === State ===
let scanning = false;
let audioCtx, analyser, micStream, camStream;
let animFrame;
let ghostActive = false;
let ghostTimer = null;
let logLines = ['[ نظام ] جاهز للمسح...'];
let sweepAngle = 0;
let tempBase = 22;

// === Audio bars init ===
const audioBarsEl = document.getElementById('audioBars');
const BAR_COUNT = 28;
for (let i = 0; i < BAR_COUNT; i++) {
  const b = document.createElement('div');
  b.className = 'audio-bar';
  b.style.height = '2px';
  audioBarsEl.appendChild(b);
}

// === Toggle scan ===
async function toggleScan() {
  if (!scanning) await startScan();
  else stopScan();
}

async function startScan() {
  scanning = true;
  document.getElementById('startBtn').textContent = 'إيقاف المسح ■';
  document.getElementById('startBtn').classList.add('active');
  addLog('[ نظام ] بدء التشغيل...', '');

  // Camera
  try {
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode:'environment' }, audio:false });
    const vid = document.getElementById('cameraFeed');
    vid.srcObject = camStream;
    vid.style.display = 'block';
    document.getElementById('cameraPlaceholder').style.display = 'none';
    document.getElementById('radarOverlay').classList.add('active');
    addLog('[ كاميرا ] تم تفعيل الكاميرا', '');
  } catch(e) {
    addLog('[ تحذير ] لم يتم الوصول للكاميرا', 'warn');
  }

  // Mic
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio:true, video:false });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 64;
    const src = audioCtx.createMediaStreamSource(micStream);
    src.connect(analyser);
    addLog('[ ميكروفون ] يستمع للترددات الخفية', '');
  } catch(e) {
    addLog('[ تحذير ] لم يتم الوصول للميكروفون', 'warn');
  }

  addLog('[ مسح ] فحص المنطقة...', '');
  loop();
}

function stopScan() {
  scanning = false;
  cancelAnimationFrame(animFrame);
  if (camStream) camStream.getTracks().forEach(t => t.stop());
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  if (audioCtx) audioCtx.close();
  document.getElementById('cameraFeed').style.display = 'none';
  document.getElementById('cameraPlaceholder').style.display = 'flex';
  document.getElementById('radarOverlay').classList.remove('active');
  document.getElementById('startBtn').textContent = 'ابدأ المسح 👻';
  document.getElementById('startBtn').classList.remove('active');
  setNormal();
  addLog('[ نظام ] تم إيقاف المسح', '');
  updateUI(0, 0);
}

// === Main loop ===
let tick = 0;
function loop() {
  if (!scanning) return;
  tick++;
  animFrame = requestAnimationFrame(loop);

  // Get real audio
  let audioLevel = 0;
  let freqData = new Uint8Array(analyser ? analyser.frequencyBinCount : 32);
  if (analyser) {
    analyser.getByteFrequencyData(freqData);
    audioLevel = freqData.reduce((a,b)=>a+b,0) / freqData.length / 255;
  }

  // Fake EMF based partly on audio + random drift
  const randomDrift = Math.sin(tick * 0.02) * 0.15 + Math.random() * 0.05;
  let emfLevel = Math.min(1, audioLevel * 3 + randomDrift);

  // Ghost event trigger: random ~every 15-40s OR very loud audio
  if (!ghostActive) {
    if (audioLevel > 0.45 || (tick % (Math.floor(Math.random()*1200)+900) === 0)) {
      triggerGhost(emfLevel, audioLevel);
    }
  }

  updateUI(emfLevel, audioLevel, freqData);
  updateRadar();
}

// === Ghost trigger ===
function triggerGhost(emf, audio) {
  ghostActive = true;
  const msgs = [
    'تيار هواء بارد مكتشف!',
    'موجات غير مفسرة!',
    'صوت أثيري رُصد!',
    'اضطراب كهرومغناطيسي حاد!',
    'حضور غير مرئي قريب!',
    'ظاهرة روحية نشطة!'
  ];
  const msg = msgs[Math.floor(Math.random()*msgs.length)];
  document.getElementById('alertBox').classList.add('show');
  document.getElementById('alertMsg').textContent = msg;
  document.getElementById('ghostBlip').style.display = 'block';
  document.getElementById('ghostBlip').style.top = (15+Math.random()*70)+'%';
  document.getElementById('ghostBlip').style.left = (10+Math.random()*80)+'%';
  document.body.classList.add('ghost-detected');
  setTimeout(()=>document.body.classList.remove('ghost-detected'), 400);
  addLog('[ ⚠ خطر ] ' + msg, 'danger');
  playBeep(880, 0.4, 0.8);
  setTimeout(()=>playBeep(660, 0.3, 0.6), 300);
  ghostTimer = setTimeout(() => {
    ghostActive = false;
    document.getElementById('alertBox').classList.remove('show');
    document.getElementById('ghostBlip').style.display = 'none';
    setNormal();
    addLog('[ نظام ] عاد إلى الحالة الطبيعية', '');
  }, 4000 + Math.random()*3000);
}

function setNormal() {
  ['activityLevel','zoneStatus','tempVal','emfVal'].forEach(id=>{
    document.getElementById(id).classList.remove('danger','warn');
  });
}

// === Update UI ===
function updateUI(emfLevel, audioLevel, freqData) {
  const pct = Math.round(emfLevel * 100);
  document.getElementById('emfFill').style.width = pct + '%';
  document.getElementById('emfPct').textContent = pct + '%';
  document.getElementById('activityLevel').textContent = pct + '%';

  const actEl = document.getElementById('activityLevel');
  const zoneEl = document.getElementById('zoneStatus');
  if (ghostActive || pct > 70) {
    actEl.className = 'status-value danger';
    zoneEl.className = 'status-value danger';
    zoneEl.textContent = '⚠ خطر';
  } else if (pct > 35) {
    actEl.className = 'status-value warn';
    zoneEl.className = 'status-value warn';
    zoneEl.textContent = 'مشبوهة';
  } else {
    actEl.className = 'status-value';
    zoneEl.className = 'status-value';
    zoneEl.textContent = 'آمنة';
  }

  // Fake temp drop during ghost
  if (ghostActive) {
    const coldTemp = tempBase - 4 - Math.random()*3;
    document.getElementById('tempVal').textContent = coldTemp.toFixed(1)+'°C';
    document.getElementById('tempVal').className = 'status-value danger';
  } else {
    const t = tempBase + (Math.random()-0.5)*0.4;
    document.getElementById('tempVal').textContent = t.toFixed(1)+'°C';
    document.getElementById('tempVal').className = 'status-value';
  }

  // EMF Hz
  const hz = Math.round(emfLevel * 50 + Math.random()*5);
  document.getElementById('emfVal').textContent = hz + ' Hz';
  if (ghostActive) document.getElementById('emfVal').className = 'status-value danger';
  else document.getElementById('emfVal').className = 'status-value';

  // Audio bars
  const bars = audioBarsEl.querySelectorAll('.audio-bar');
  bars.forEach((bar, i) => {
    let h;
    if (freqData && freqData.length > 0) {
      const idx = Math.floor(i * freqData.length / BAR_COUNT);
      h = (freqData[idx] / 255) * 48;
    } else {
      h = Math.random() * 6 + 1;
    }
    if (ghostActive) h = Math.max(h, Math.random() * 30 + 10);
    bar.style.height = Math.max(2, h) + 'px';
    bar.style.background = h > 32 ? 'var(--red)' : h > 20 ? 'var(--amber)' : 'var(--green)';
  });
  document.getElementById('audioPct').textContent = Math.round(audioLevel*100) + ' dB';
}

// === Radar sweep ===
function updateRadar() {
  sweepAngle = (sweepAngle + 1.5) % 360;
  const rad = sweepAngle * Math.PI / 180;
  const cx = 200, cy = 150, r = 200;
  const x = cx + r * Math.cos(rad);
  const y = cy + r * Math.sin(rad);
  // Draw a 60-degree arc sweep
  const startRad = rad - Math.PI/3;
  const sx = cx + r * Math.cos(startRad);
  const sy = cy + r * Math.sin(startRad);
  const path = document.getElementById('sweepPath');
  if (path) {
    path.setAttribute('d', `M ${cx} ${cy} L ${sx} ${sy} A ${r} ${r} 0 0 1 ${x} ${y} Z`);
  }
}

// === Log ===
function addLog(msg, type) {
  const box = document.getElementById('logBox');
  const entry = document.createElement('div');
  entry.className = 'log-entry' + (type ? ' '+type : '');
  const time = new Date().toLocaleTimeString('ar', {hour12:false});
  entry.textContent = `${time} ${msg}`;
  box.appendChild(entry);
  box.scrollTop = box.scrollHeight;
  if (box.children.length > 30) box.removeChild(box.children[0]);
}

// === Beep ===
function playBeep(freq, vol, duration) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = freq;
    osc.type = 'sawtooth';
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.start(); osc.stop(ctx.currentTime + duration);
    setTimeout(()=>ctx.close(), duration*1000+100);
  } catch(e) {}
}
</script>
